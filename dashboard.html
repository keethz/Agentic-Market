<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Market</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --ink: #1c1c1a; --muted: #6b6b66; --line: #e4e3df;
    --accent: #3b5bdb; --ok: #2f7d4f; --warn: #b7791f; --bad: #c0392b; --idle: #8a8a85;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161615; --card: #1f1f1d; --ink: #ecebe7; --muted: #9a9993; --line: #2f2f2c;
            --accent: #7c95f0; --ok: #5fb37f; --warn: #d9a441; --bad: #e57368; --idle: #8a8a85; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 28px 0 10px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; }
  label { color: var(--muted); font-size: 12px; cursor: pointer; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin-top: 18px; }
  .kpi, .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  .kpi { padding: 12px 14px; }
  .kpi .v { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .kpi .l { color: var(--muted); font-size: 12px; }
  .card { padding: 6px 0; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 8px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: 0; }
  td.num, th.num { text-align: right; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 999px; font-size: 11px; font-weight: 600;
          border: 1px solid currentColor; }
  .FINALIZED { color: var(--ok); } .PENDING_APPROVAL, .TENTATIVE_AGREEMENT { color: var(--warn); }
  .IMPASSE, .REJECTED { color: var(--bad); } .NEGOTIATING { color: var(--accent); }
  .bars { padding: 10px 14px; display: grid; gap: 6px; }
  .bar { display: grid; grid-template-columns: 180px 1fr 70px; align-items: center; gap: 10px; font-size: 12px; }
  .bar .track { height: 10px; background: var(--line); border-radius: 5px; overflow: hidden; }
  .bar .fill { height: 100%; background: var(--accent); border-radius: 5px; }
  .bar .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar .val { text-align: right; color: var(--muted); font-variant-numeric: tabular-nums; }
  a { color: var(--accent); text-decoration: none; }
  .empty { padding: 18px 14px; color: var(--muted); }
  @media (max-width: 560px) { .bar { grid-template-columns: 110px 1fr 56px; } }
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>Agentic Market</h1>
      <div class="sub">Agent negotiations and closed deals · refreshes every 5s · <span id="updated"></span></div>
    </div>
    <label><input type="checkbox" id="live" checked> Live runs only (hide instant scripted demos)</label>
  </header>

  <section class="kpis" id="kpis"></section>

  <h2>Seller agents</h2>
  <div class="card"><table id="agents"></table></div>

  <h2>Time to agreement (agents negotiating, seconds)</h2>
  <div class="card"><div class="bars" id="bars"></div></div>

  <h2>Negotiations</h2>
  <div class="card"><table id="deals"></table></div>
</main>
<script>
const $ = id => document.getElementById(id);
const money = v => v == null ? "—" : "$" + Math.round(v).toLocaleString();
const secs = v => v == null ? "—" : v < 60 ? v.toFixed(1) + "s" : (v / 60).toFixed(1) + "m";
const avg = xs => xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : null;
const esc = s => String(s ?? "—").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const live = (() => { try { return localStorage.getItem("live") !== "0"; } catch { return true; } })();
$("live").checked = live;
$("live").onchange = e => { try { localStorage.setItem("live", e.target.checked ? "1" : "0"); } catch {} load(); };

function render(all) {
  const rows = $("live").checked ? all.filter(r => r.time_to_agreement_s == null || r.time_to_agreement_s >= 1) : all;
  const done = rows.filter(r => r.status !== "NEGOTIATING");
  const closed = rows.filter(r => r.status === "FINALIZED");
  const agreed = rows.filter(r => r.contract_id);
  const timedAgreed = agreed.filter(r => r.time_to_agreement_s != null);
  const kpis = [
    ["Negotiations", rows.length],
    ["Deals closed", closed.length],
    ["Agreement rate", done.length ? Math.round(100 * agreed.length / done.length) + "%" : "—"],
    ["Avg time to agreement", secs(avg(timedAgreed.map(r => r.time_to_agreement_s)))],
    ["Avg time to close", secs(avg(closed.filter(r => r.time_to_close_s != null).map(r => r.time_to_close_s)))],
    ["Closed value", money(closed.reduce((a, r) => a + (r.total_value || 0), 0))],
  ];
  $("kpis").innerHTML = kpis.map(([l, v]) => `<div class="kpi"><div class="v">${v}</div><div class="l">${l}</div></div>`).join("");

  const by = {};
  rows.forEach(r => (by[r.seller] ??= []).push(r));
  const agentRows = Object.entries(by).filter(([s]) => s !== "?").map(([s, rs]) => {
    const c = rs.filter(r => r.status === "FINALIZED"), a = rs.filter(r => r.contract_id);
    return `<tr><td>${esc(s)}</td><td class="num">${rs.length}</td><td class="num">${a.length}</td><td class="num">${c.length}</td>
      <td class="num">${rs.filter(r => r.status === "IMPASSE").length}</td>
      <td class="num">${secs(avg(a.filter(r => r.time_to_agreement_s != null).map(r => r.time_to_agreement_s)))}</td>
      <td class="num">${money(c.reduce((x, r) => x + (r.total_value || 0), 0))}</td></tr>`;
  });
  $("agents").innerHTML = `<tr><th>Seller agent</th><th class="num">Negotiations</th><th class="num">Agreed</th>
    <th class="num">Closed</th><th class="num">Impasse</th><th class="num">Avg time to agree</th><th class="num">Closed value</th></tr>`
    + (agentRows.join("") || `<tr><td class="empty" colspan="7">No negotiations yet</td></tr>`);

  const timed = timedAgreed.slice(0, 12);
  const max = Math.max(...timed.map(r => r.time_to_agreement_s), 1);
  $("bars").innerHTML = timed.map(r => `<div class="bar" title="${esc(r.negotiation_id)}: ${r.rounds} rounds">
      <span class="name">${esc(r.seller)} → ${esc(r.buyer)} <span class="sub">${esc(r.negotiation_id.slice(4))}</span></span>
      <span class="track"><span class="fill" style="display:block;width:${100 * r.time_to_agreement_s / max}%"></span></span>
      <span class="val">${secs(r.time_to_agreement_s)}</span></div>`).join("") || `<div class="empty">No agreements yet</div>`;

  $("deals").innerHTML = `<tr><th>Started</th><th>Seller → Buyer</th><th>Status</th><th class="num">Rounds</th>
    <th class="num">Time to agree</th><th class="num">Time to close</th><th class="num">Price/seat</th><th class="num">Value</th>
    <th class="num">Leaks blocked</th><th>Contract</th></tr>` + rows.map(r => `<tr>
      <td>${new Date(r.started_at).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"})}</td>
      <td>${esc(r.seller === "?" ? "—" : r.seller)} → ${esc(r.buyer === "?" ? "—" : r.buyer)}</td>
      <td><span class="pill ${esc(r.status)}" title="${esc(r.reason)}">${esc(r.status.replace("_", " "))}</span></td>
      <td class="num">${r.rounds}</td><td class="num">${secs(r.time_to_agreement_s)}</td><td class="num">${secs(r.time_to_close_s)}</td>
      <td class="num">${r.final_price == null ? "—" : "$" + r.final_price.toFixed(2)}</td><td class="num">${money(r.total_value)}</td>
      <td class="num">${r.leak_attempts_blocked}</td>
      <td>${r.has_pdf ? `<a href="/contracts/${esc(r.contract_id)}.pdf" target="_blank">${esc(r.contract_id)} PDF</a>` : esc(r.contract_id)}</td></tr>`).join("");
}

async function load() {
  try {
    const r = await fetch("/api/deals");
    render(await r.json());
    $("updated").textContent = "updated " + new Date().toLocaleTimeString();
  } catch { $("updated").textContent = "offline"; }
}
load();
setInterval(load, 5000);
</script>
</body>
</html>
