# PRIVATE — never put these values into BAND messages.
company_id: company_a
objectives:
  - Maximise total contract value
  - Prefer contracts of 24 months or longer
  - Keep payment terms short to protect cash flow
terms:
  unit_price:        {min: 80,  max: 140,   target: 115}
  quantity:          {min: 200, max: 1000,  target: 500}
  contract_months:   {min: 12,  max: 36,    target: 24}
  payment_terms_days: {min: 15,  max: 45,    target: 30}
  sla_uptime:        {min: 99.5, max: 99.95, target: 99.9}
  support_tier:      {allowed: [standard, premium]}
non_negotiable:
  payment_terms_days: {max: 60}
approval_rules:
  - {role: Sales Manager}
  - {role: VP Sales, when: {field: total_value, op: ">", value: 40000}}
